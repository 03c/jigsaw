name: E2E (Docker stack)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-docker-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies (Playwright + app)
        run: npm ci

      - name: Generate Keycloak dev realm for CI
        env:
          PANEL_DOMAIN: localhost:3000
          KEYCLOAK_CLIENT_SECRET: dev-jigsaw-client-secret
          KEYCLOAK_ADMIN_PASSWORD: admin
        run: npm run dev:realm

      - name: Start stack (PostgreSQL, Keycloak, panel)
        run: docker compose -f docker-compose.ci.yml up -d --build

      - name: Wait for Keycloak OIDC
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/realms/jigsaw/.well-known/openid-configuration >/dev/null; then
              echo "Keycloak is ready"
              exit 0
            fi
            echo "waiting for Keycloak ($i)..."
            sleep 5
          done
          echo "Keycloak did not become ready in time"
          exit 1

      - name: Push Drizzle schema to PostgreSQL
        run: docker compose -f docker-compose.ci.yml exec -T jigsaw npm run db:push

      - name: Wait for panel HTTP
        run: |
          for i in $(seq 1 30); do
            if curl -sfI http://127.0.0.1:3000/ >/dev/null; then
              echo "Panel is up"
              exit 0
            fi
            echo "waiting for panel ($i)..."
            sleep 3
          done
          docker compose -f docker-compose.ci.yml logs --no-color
          exit 1

      - name: Install Playwright browsers
        run: npm run test:e2e:install

      - name: Run Playwright E2E against panel container
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v
