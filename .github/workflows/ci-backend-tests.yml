name: Backend tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Backend unit tests with coverage
        run: npx vitest run --coverage tests/unit/lib

  integration:
    name: Integration (Vitest + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jigsaw
          POSTGRES_PASSWORD: jigsaw_secret
          POSTGRES_DB: jigsaw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jigsaw -d jigsaw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://jigsaw:jigsaw_secret@127.0.0.1:5432/jigsaw
      NODE_ENV: development
      SESSION_SECRET: ci-test-session-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Push schema to test database
        run: npm run db:push

      - name: Integration tests
        run: npm run test:integration
