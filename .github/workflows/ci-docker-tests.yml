name: Docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hadolint:
    name: Hadolint (Dockerfiles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/templates/web/Dockerfile

  trivy:
    name: Trivy (Dockerfile security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy config scan on Dockerfiles
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          trivyignores: .trivyignore
          severity: CRITICAL,HIGH

  build-panel:
    name: Build panel image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build panel (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: jigsaw-panel:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-php:
    name: Build PHP site image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build PHP template image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./docker/templates/web
          file: ./docker/templates/web/Dockerfile
          push: false
          tags: jigsaw-php:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose-integration:
    name: Postgres container + integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jigsaw
          POSTGRES_PASSWORD: ci_postgres_secret
          POSTGRES_DB: jigsaw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jigsaw -d jigsaw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://jigsaw:ci_postgres_secret@127.0.0.1:5432/jigsaw
      NODE_ENV: development
      SESSION_SECRET: ci-compose-session-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Push schema and run integration tests
        run: |
          npm run db:push
          npm run test:integration

      - uses: docker/setup-buildx-action@v3

      - name: Verify panel Dockerfile still builds in isolation
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: jigsaw-panel:compose-ci
