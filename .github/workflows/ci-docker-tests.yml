name: Docker & image QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-qa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/templates/web/Dockerfile
          failure-threshold: error

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reports CRITICAL/HIGH Dockerfile misconfigurations; set exit-code to 1 once the baseline is clean.
      - name: Run Trivy config scan (Dockerfiles)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "0"

  build-panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build panel image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: jigsaw-panel:ci

      - name: Image exists
        run: docker image inspect jigsaw-panel:ci

  build-php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build PHP site image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./docker/templates/web
          file: ./docker/templates/web/Dockerfile
          push: false
          load: true
          tags: jigsaw-php:ci

      - name: Image exists
        run: docker image inspect jigsaw-php:ci
