name: Integration tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  http-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jigsaw
          POSTGRES_PASSWORD: jigsaw_secret
          POSTGRES_DB: jigsaw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jigsaw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://jigsaw:jigsaw_secret@127.0.0.1:5432/jigsaw
      NODE_ENV: development
      SESSION_SECRET: test-session-secret-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate React Router types
        run: npx react-router typegen

      - name: Build application
        run: npm run build

      - name: Push database schema
        run: npm run db:push

      - name: Run HTTP integration tests
        run: npm run test:integration
