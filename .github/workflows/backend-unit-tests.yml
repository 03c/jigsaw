name: Backend unit tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: backend-unit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate React Router types
        run: npx react-router typegen

      - name: Run backend unit tests
        run: npx vitest run tests/unit/backend
