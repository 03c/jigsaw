name: E2E & visual (Docker stack)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies (Playwright only)
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Keycloak realm for CI
        run: npm run ci:prepare-realm

      - name: Build and start stack
        run: |
          docker compose -f docker-compose.ci.yml up -d --build
          echo "Waiting for Keycloak..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:18080/realms/jigsaw/.well-known/openid-configuration >/dev/null; then
              echo "Keycloak is ready"
              break
            fi
            sleep 5
          done
          curl -sf http://localhost:18080/realms/jigsaw/.well-known/openid-configuration || exit 1

      - name: Apply database schema
        run: docker compose -f docker-compose.ci.yml exec -T jigsaw npm run db:push

      - name: Wait for panel
        run: |
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null -w "%{http_code}" http://localhost:3000/ | grep -qE '302|200'; then
              echo "Panel responding"
              exit 0
            fi
            sleep 3
          done
          docker compose -f docker-compose.ci.yml logs --tail 80 jigsaw
          exit 1

      - name: Run Playwright (smoke)
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test tests/e2e/smoke.spec.ts

      - name: Run Playwright (Keycloak smoke)
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test tests/e2e/keycloak-smoke.spec.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v
