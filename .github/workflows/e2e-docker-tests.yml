name: E2E and container integration

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Keycloak realm for CI
        env:
          PANEL_DOMAIN: "127.0.0.1:3000"
          KEYCLOAK_CLIENT_SECRET: ci-test-client-secret
        run: npm run prepare:ci-realm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start stack
        run: |
          docker compose -f docker-compose.ci.yml build jigsaw
          docker compose -f docker-compose.ci.yml up -d

      - name: Wait for panel /health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/health | grep -q '"status":"ok"'; then
              echo "Panel is up"
              exit 0
            fi
            sleep 2
          done
          echo "Timeout waiting for panel"
          docker compose -f docker-compose.ci.yml logs
          exit 1

      - name: Apply database schema in panel container
        run: docker compose -f docker-compose.ci.yml exec -T jigsaw npm run db:push

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright (E2E + visual)
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          CI: "true"
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v
