name: Docker validation

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: docker-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Lint PHP site image Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/templates/web/Dockerfile
          failure-threshold: error

  trivy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "0"

  build-images:
    runs-on: ubuntu-latest
    needs: [hadolint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build panel image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: jigsaw-panel:ci

      - name: Build PHP site image
        uses: docker/build-push-action@v6
        with:
          context: ./docker/templates/web
          file: ./docker/templates/web/Dockerfile
          push: false
          load: true
          tags: jigsaw-php:ci
