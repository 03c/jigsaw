# Shared stack for local dev (Postgres + Keycloak) and CI E2E (adds panel container).
# - Default: `docker compose -f docker-compose.dev.yml up -d` — databases + Keycloak only.
# - E2E: `docker compose -f docker-compose.dev.yml --profile e2e up -d --build` — also builds/runs the panel image.

services:
  postgres:
    image: postgres:17-alpine
    container_name: jigsaw_postgres_local
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jigsaw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jigsaw_secret}
      POSTGRES_DB: jigsaw
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres-local:/var/lib/postgresql/data
      - ./docker/init-keycloak-db.sql:/docker-entrypoint-initdb.d/init-keycloak-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jigsaw}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: jigsaw_keycloak_local
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-jigsaw}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-jigsaw_secret}
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/jigsaw-realm.dev.json:/opt/keycloak/data/import/jigsaw-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  jigsaw:
    profiles: [e2e]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://jigsaw:jigsaw_secret@postgres:5432/jigsaw
      DOCKER_API_VERSION: "1.44"
      KEYCLOAK_ISSUER_URL: http://keycloak:8080/realms/jigsaw
      KEYCLOAK_PUBLIC_URL: http://localhost:8080/realms/jigsaw
      KEYCLOAK_CONSOLE_URL: http://localhost:8080
      KEYCLOAK_CLIENT_ID: jigsaw-panel
      KEYCLOAK_CLIENT_SECRET: dev-jigsaw-client-secret
      PANEL_URL: http://localhost:3000
      SESSION_SECRET: ci-session-secret-change-me
      NODE_ENV: production
      ALLOW_E2E_503_HOOK: "true"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
